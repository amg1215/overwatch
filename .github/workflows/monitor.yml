name: Ebisu New Arrivals Monitor

on:
  # No 'schedule:' trigger anymore - GitHub's own scheduler was silently
  # delaying/dropping runs by hours regardless of cron interval (tested at
  # both 1-min and 5-min). An external cron service (cron-job.org) now
  # calls the API below to fire this on time instead.
  workflow_dispatch: {}
  repository_dispatch:
    types: [run-monitor]

concurrency:
  group: ebisu-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SUPPLIER_EMAIL: ${{ secrets.SUPPLIER_EMAIL }}
          SUPPLIER_PASSWORD: ${{ secrets.SUPPLIER_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Commit updated state.json
        run: |
          git config user.name "ebisu-monitor-bot"
          git config user.email "actions@github.com"
          git add -f state.json monitor.log
          git diff --staged --quiet || git commit -m "Update monitor state [skip ci]"
          git push
