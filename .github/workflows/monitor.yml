name: Ebisu New Arrivals Monitor

on:
  schedule:
    # ---- FAST WINDOW: every minute, 9am-9pm EDT (UTC-4) = 13:00-00:59 UTC ----
    # NOTE: cron here is in UTC and does NOT auto-adjust for US Daylight
    # Saving Time. EDT (summer, UTC-4) is what's in effect right now.
    # In winter EST (UTC-5) is in effect - shift every hour below back by
    # 1 hour (e.g. 13:00 UTC becomes 14:00 UTC) around early Nov / mid Mar,
    # or ask to have this regenerated for the other half of the year.
    - cron: '* 13-23 * * *'
    - cron: '* 0 * * *'
    # ---- SLOW WINDOW: every 10 minutes, the remaining hours (9pm-9am EDT) ----
    - cron: '*/10 1-12 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Only one run at a time; if a run is still going when the next tick fires,
# skip the new one instead of piling up overlapping scrapes.
concurrency:
  group: ebisu-monitor
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the updated state.json back to the repo

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SUPPLIER_EMAIL: ${{ secrets.SUPPLIER_EMAIL }}
          SUPPLIER_PASSWORD: ${{ secrets.SUPPLIER_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Commit updated state.json
        run: |
          git config user.name "ebisu-monitor-bot"
          git config user.email "actions@github.com"
          git add state.json monitor.log
          git diff --staged --quiet || git commit -m "Update monitor state [skip ci]"
          git push
